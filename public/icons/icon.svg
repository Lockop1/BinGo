<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Bingo Night logo (master). A 3x3 bingo card in thick marker strokes with one
       winning line scribbled through it in red, on a paper square. Strokes are 44/512
       (above 1/12 of the width) so the grid still reads at 32 px. The same paths live in
       src/components/brand/logoArt.ts (a unit test keeps them in sync); PNGs and the
       favicon come from scripts/make-icons.mjs. -->
  <rect width="512" height="512" rx="104" fill="#fbf8ef"/>
  <g fill="none" stroke="#24272a" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 64 Q180 56 300 61 Q390 65 450 58"/>
    <path d="M452 60 Q458 180 450 300 Q446 390 453 452"/>
    <path d="M452 450 Q340 458 220 451 Q120 446 60 453"/>
    <path d="M60 452 Q54 340 60 220 Q64 120 58 62"/>
    <path d="M192 61 Q186 190 193 320 Q196 400 190 451"/>
    <path d="M321 60 Q327 180 320 300 Q317 400 323 452"/>
    <path d="M59 193 Q180 185 300 192 Q390 196 451 189"/>
    <path d="M58 320 Q170 326 290 319 Q380 315 452 323"/>
  </g>
  <g fill="none" stroke="#c8302a" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="48" d="M102 404 Q236 284 406 100"/>
    <path stroke-width="30" d="M412 122 Q280 270 126 420"/>
  </g>
</svg>
